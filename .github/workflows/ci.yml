# ============================================================================
# CI de PokéGrading
#
# Corre en cada push a main/develop y en cada PR hacia esas ramas.
# Jobs:
#   backend  -> lint (ruff) + format check (black) + migración + tests
#   frontend -> type-check + build de producción
#
# Cobertura:
#   - Backend: pytest --cov → reporte xml + html subido como artifact
#   - Frontend: tsc --noEmit (no hay tests todavía; se agregan con Vitest)
#
# Convención: si CI falla, no se mergea. Configurar branch protection
# en GitHub UI para hacerlo obligatorio (instrucciones en el README).
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancela runs anteriores del mismo ref cuando llega uno nuevo (ahorra minutos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # BACKEND
  # ==========================================================================
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    # Postgres como servicio del runner. Usado por la migración para
    # validar que el SQL generado funciona contra Postgres real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pokegrading
          POSTGRES_PASSWORD: pokegrading
          POSTGRES_DB: pokegrading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://pokegrading:pokegrading@localhost:5432/pokegrading_test
      # Secret de CI exclusivamente — no es el de prod, no es sensible.
      JWT_SECRET_KEY: ci-secret-only-used-in-github-actions-runners-not-real-32chars
      JWT_ALGORITHM: HS256
      JWT_ACCESS_MINUTES: "15"
      JWT_REFRESH_DAYS: "7"
      LOG_LEVEL: WARNING
      DISCLOSURE_VERSION: v1.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check src tests

      - name: Format check (black)
        working-directory: backend
        run: black --check src tests

      - name: Apply migrations against Postgres
        working-directory: backend
        run: alembic upgrade head

      - name: Tests with coverage
        working-directory: backend
        run: |
          pytest \
            --cov=pokegrading \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 7

  # ==========================================================================
  # FRONTEND
  # ==========================================================================
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
