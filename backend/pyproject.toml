[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokegrading"
version = "0.1.0"
description = "Plataforma de pre-grading de cartas Pokémon para LATAM"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Equipo PokéGrading" }]

dependencies = [
    "fastapi>=0.111,<0.120",
    "uvicorn[standard]>=0.30,<0.40",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyjwt[crypto]>=2.8,<3.0",
    "bcrypt>=4.0,<6.0",
    "email-validator>=2.1,<3.0",
    "structlog>=24.1,<26.0",
    "python-multipart>=0.0.9,<1.0",
    "psycopg2-binary",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    "black>=24.0,<26.0",
    "ruff>=0.5,<1.0",
    "pre-commit>=3.7,<5.0",
    "aiosqlite>=0.20,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pokegrading"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# Reemplaza flake8 + isort + algunas reglas de bugbear / pyupgrade
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RET"]
ignore = [
    "E501",  # line-length lo controla black
    "N818",  # nuestras excepciones usan prefijo `Error*` en español (decisión del equipo)
]
[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RET"]
"tests/*" = ["S101"]  # asserts permitidos en tests

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
